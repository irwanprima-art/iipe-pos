services:
  db:
    image: postgres:16-alpine
    container_name: iipe-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: iipe-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PORT: "${BACKEND_PORT:-8080}"
      MOCK_PAYMENTS: "${MOCK_PAYMENTS:-true}"
      AFFILIATE_CODE: "${AFFILIATE_CODE:-}"
      N8N_WEBHOOK_URL: "${N8N_WEBHOOK_URL:-}"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"
      S3_SECURE: "${S3_SECURE:-true}"
      MAX_IMAGE_DIM: "${MAX_IMAGE_DIM:-1200}"
      SUMO_API_URL: "${SUMO_API_URL:-https://api-pay-sandbox.sumopod.com}"
      SUMO_API_KEY: "${SUMO_API_KEY:-}"
      SUMO_WEBHOOK_SECRET: "${SUMO_WEBHOOK_SECRET:-}"
      SUMO_WEBHOOK_TOKEN: "${SUMO_WEBHOOK_TOKEN:-}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: iipe-frontend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
